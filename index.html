{name:'Meaning Match',sub:'Bedeutungen knacken',icon:'◈',time:'4–5 Min.',badge:'Meaning Master',tip:'Ordne immer nach der Bedeutung zu: Fähigkeit, Erlaubnis oder Pflicht. Besonders wichtig: „nicht müssen“ ist keine Verbotsregel.',table:[['können','be able to'],['dürfen','be allowed to'],['müssen','have to'],['nicht müssen','not have to'],['nicht dürfen','not be allowed to']],tasks:[

mc('„You mustn’t run here.“ Welche Bedeutung passt?','Du darfst hier nicht rennen.',['Du musst hier nicht rennen.','Du kannst hier nicht rennen.','Du musst hier rennen.'],'Mustn’t ist ein Verbot.'),

{name:'Present Power',sub:'Die Gegenwart meistern',icon:'ϟ',time:'5–6 Min.',badge:'Present Pro',tip:'Passe be und have an das Subjekt an. Bei Verneinungen mit have to brauchst du don’t oder doesn’t. Nach doesn’t steht have, nicht has.',table:[['I / he, she / we, they','am / is / are'],['I, you, we, they','have to / don’t have to'],['he, she, it','has to / doesn’t have to']],tasks:[

{name:'Time Warp',sub:'Past & Future freischalten',icon:'⌁',time:'6–7 Min.',badge:'Time Traveller',tip:'Im Simple Past: was/were able to, was/were allowed to und had to. Im Will-Future: will be able to, will be allowed to und will have to.',table:[['können','was/were able to → will be able to'],['dürfen','was/were allowed to → will be allowed to'],['müssen','had to → will have to'],['nicht müssen','didn’t have to → won’t have to'],['nicht dürfen','wasn’t/weren’t allowed to → won’t be allowed to']],tasks:[

{name:'Workbook Duel',sub:'Dein Workbook-Duell',icon:'♛',time:'6–7 Min.',badge:'Modal Champion',tip:'Jetzt tippst du nur die fehlende Ersatzform. Achte auf Zeitangaben und Bedeutung. Kurzformen (z. B. didn’t) und ausgeschriebene Formen (did not) zählen beide. Ein Punkt am Ende ist optional.',table:[['Fähigkeit','be able to'],['Erlaubnis / Verbot','(not) be allowed to'],['Pflicht / nicht nötig','(not) have to']],tasks:[

lowed to park here but you do not have to leave."], "e": "Zwei Bedeutungen: Verbot = not allowed to; nicht nötig = not have to.", "type": "translate"}, {"q": "Übersetze: Konntest du gestern deine Hausaufgaben fertig machen? Nutze die Ersatzform.", "a": "Were you able to finish your homework yesterday?", "accept": ["Yesterday were you able to finish your homework?"], "e": "Were you able to …? Nach to steht die Grundform finish.", "type": "translate"}, {"q": "Übersetze: Obwohl er müde war, musste er weiterarbeiten.", "a": "Although he was tired, he had to keep working.", "accept": ["Although he was tired he had to keep working.", "Although he was tired, he had to continue working.", "Although he was tired he had to continue working.", "Even though he was tired, he had to keep working.", "Even though he was tired he had to keep working.", "He had to keep working although he was tired.", "He had to continue working although he was tired.", "Although he was tired, he had to carry on working."], "e": "Obwohl = although / even though. Vergangene Pflicht = had to.", "type": "translate"}, {"q": "Übersetze: Wir durften gestern nicht schwimmen, aber morgen werden wir schwimmen dürfen.", "a": "We were not allowed to swim yesterday, but we will be allowed to swim tomorrow.", "accept": ["We were not allowed to swim yesterday but we will be allowed to swim tomorrow.", "Yesterday we were not allowed to swim, but tomorrow we will be allowed to swim.", "Yesterday we were not allowed to swim but tomorrow we will be allowed to swim."], "e": "Zwei Zeiten: were not allowed to → will be allowed to.", "type": "translate"}]});

function beep(ok){if(!sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:180;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.18);o.onended=()=>c.close()}catch{}}
function goTop(){window.scrollTo({top:0,behavior:'instant'})}
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">YOUR GRAMMAR. NEXT LEVEL.</div><h1>Small words.<br><em>Big powers.</em></h1><p>Knacke modale Ersatzformen, reise durch die Zeiten und besiege den Final Boss. Vier Trainingslevels. Ein neuer Final Boss. Deine Mission.</p><div class="chips"><span>◷ 25 Min. + Expertenlevel</span><span>5 Levels / 55 Aufgaben</span><span>70 % zum Aufstieg</span></div></div><div class="cabinet" aria-hidden="true"><div class="screen"><strong>MODAL POWER</strong><div class="alien">▟▙<br style="display:none"></div><div style="color:#b5a1ff;font-size:24px;margin:8px">+ + + + +</div><small>PRESS START TO LEARN</small></div></div></section><div class="section-head"><h2>Choose your level</h2><span class="subtle">${best.filter(x=>x>=70).length} / 5 Abzeichen</span></div><section class="cards">${levels.map((l,i)=>{const open=i===0||best[i-1]>=70;return `<article class="card ${open?'active':'locked'}"><div class="number">${l.icon} <span style="font-size:13px">0${i+1}</span></div><h3>${l.name}</h3><p>${l.sub}</p><div class="meta">${l.tasks.length} Aufgaben · ${l.time}${best[i]?` · Best: ${best[i]} %`:''}</div><button ${open?'':'disabled'} class="${open?'primary':''}" data-level="${i}">${best[i]>=70?'✓ Nochmal spielen':open?'Level starten →':'▣ Noch gesperrt'}</button></article>`}).join('')}</section><div class="rule"><strong>HOW TO WIN</strong><span>Mindestens 70 % → nächstes Level. Im Final Boss: 11 von 15 richtig. Keine verlorenen Leben. Neue Versuche sind immer möglich. Fortschritt gilt für diesen Durchlauf.</span></div>`;app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>intro(+b.dataset.level));goTop()}
function intro(n){if(n>0&&best[n-1]<70)return;current=n;const l=levels[n];app.innerHTML=`<section class="play intro"><button id="back">← Levelauswahl</button><div class="eyebrow" style="margin-top:30px">LEVEL 0${n+1} / BRIEFING</div><h1>${l.name}</h1><p>${n===4?'Der neue Endgegner: 15 Übersetzungen. Tippe ganze englische Sätze mit modalen Ersatzformen.':n===3?'Tippe nur die fehlenden Wörter – keine ganzen Sätze.':'Auswählen, zuordnen und Bausteine antippen. Du brauchst hier keine Tastatur.'}</p><div class="tip"><h3>Power-up: dein Spickzettel</h3><p>${l.tip}</p><table>${l.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div><p>${l.tasks.length} Aufgaben · mindestens ${Math.ceil(l.tasks.length*.7)} richtige Antworten · ${l.time}</p><button class="primary" id="start">LET’S PLAY →</button></section>`;app.querySelector('#back').onclick=home;app.querySelector('#start').onclick=()=>{idx=0;score=0;streak=0;xp=0;answers=[];question()};goTop()}
function question(){done=false;picked=[];selected=null;const t=levels[current].tasks[idx];pool=t.type==='build'?shuffle([...t.a.split(' '),...t.extra]):(t.type==='fill'||t.type==='translate')?[]:shuffle([t.a,...t.wrong]);app.innerHTML=`<section class="play"><div class="topline"><button id="back">← Levelauswahl</button><span>0${current+1} / ${levels[current].name}</span><span id="stats">${xp} XP · <span class="combo">${streak}× COMBO</span></span></div><div class="progress" aria-label="Fortschritt"><i style="width:${idx/levels[current].tasks.length*100}%"></i></div><div class="task"><div class="eyebrow">MISSION ${String(idx+1).padStart(2,'0')} / ${levels[current].tasks.length} · ${t.type==='build'?'BUILD IT':t.type==='translate'?'TRANSLATE IT':t.type==='fill'?'TYPE IT':t.type==='match'?'MATCH IT':'PICK IT'}</div><h2>${esc(t.q)}</h2><div id="interaction"></div><div id="feedback" aria-live="polite"></div><div class="actions"><button id="hint">? Lernkarte</button><button class="primary" id="check" disabled>Antwort prüfen →</button></div><div id="hintbox" class="tip hidden"><p>${levels[current].tip}</p><table>${levels[current].table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div></div><p class="subtle">Jede Aufgabe zählt einmal. Feedback lesen, weitertrainieren, Level bei Bedarf wiederholen.</p></section>`;const box=app.querySelector('#interaction');if(t.type==='fill'||t.type==='translate'){box.innerHTML=`<label for="typed" class="subtle">${t.type==='translate'?'Den ganzen Satz auf Englisch eingeben':'Nur die Wörter für die Lücke eingeben'}</label><${t.type==='translate'?'textarea rows="3"':'input type="text"'} id="typed" class="text-answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t.type==='translate'?'Dein vollständiger englischer Satz …':'Deine Ersatzform …'}">${t.type==='translate'?'</textarea>':''}`;const input=box.querySelector('#typed');input.oninput=()=>app.querySelector('#check').disabled=!input.value.trim();input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!done&&input.value.trim()){e.preventDefault();check()}}}else if(t.type==='build'){box.innerHTML='<div class="subtle" style="margin-bottom:10px">Tippe Wörter in der richtigen Reihenfolge an. Im Satz antippen = zurücklegen. Einige Wörter bleiben übrig.</div><div class="answerline" id="sentence" aria-label="Dein Satz"></div><div class="wordbank" id="bank"></div>';renderWords()}else{box.innerHTML=`<div class="options">${pool.map((a,i)=>`<button class="option" data-opt="${i}"><b>${i+1}</b>${esc(a)}</button>`).join('')}</div>`;box.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(done)return;selected=+b.dataset.opt;box.querySelectorAll('button').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});app.querySelector('#check').disabled=false})}app.querySelector('#back').onclick=home;app.querySelector('#hint').onclick=()=>{const h=app.querySelector('#hintbox');h.classList.toggle('hidden');app.querySelector('#hint').setAttribute('aria-expanded',!h.classList.contains('hidden'))};app.querySelector('#check').onclick=check;goTop()}
function renderWords(){const sentence=app.querySelector('#sentence'),bank=app.querySelector('#bank');sentence.innerHTML=picked.map((id,i)=>`<button data-remove="${i}">${esc(pool[id])}</button>`).join('');bank.innerHTML=pool.map((word,i)=>`<button data-word="${i}" ${picked.includes(i)||done?'disabled':''}>${esc(word)}</button>`).join('');sentence.querySelectorAll('button').forEach(b=>{b.disabled=done;b.onclick=()=>{picked.splice(+b.dataset.remove,1);renderWords()}});bank.querySelectorAll('button').forEach(b=>b.onclick=()=>{picked.push(+b.dataset.word);renderWords()});app.querySelector('#check').disabled=!picked.length}
function check(){if(done)return;const t=levels[current].tasks[idx];let value=(t.type==='fill'||t.type==='translate')?app.querySelector('#typed').value:t.type==='build'?picked.map(i=>pool[i]).join(' '):pool[selected];if(!value)return;done=true;const ok=[t.a,...(t.accept||[])].some(a=>norm(value)===norm(a));if(ok){score++;streak++;xp+=100+Math.min(streak-1,4)*25}else streak=0;answers.push({q:t.q,value,correct:t.a,ok,e:t.e});beep(ok);app.querySelector('#stats').innerHTML=`${xp} XP · <span class="combo">${streak}× COMBO</span>`;app.querySelectorAll('#interaction button,#interaction input,#interaction textarea').forEach(b=>b.disabled=true);app.querySelectorAll('[data-opt]').forEach(b=>{if(pool[+b.dataset.opt]===t.a)b.classList.add('correct');else if(+b.dataset.opt===selected)b.classList.add('wrong')});app.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'✓ Treffer!':'↻ Fast – merk dir diese Form:'}</strong>${ok?'':`<div>Richtig: <strong>${esc(t.a)}</strong></div>`}<div>${esc(t.e)}</div></div>`;const btn=app.querySelector('#check');btn.disabled=false;btn.textContent=idx===levels[current].tasks.length-1?'Ergebnis ansehen →':'Nächste Mission →';btn.onclick=()=>{idx++;if(idx===levels[current].tasks.length)result();else question()}}
function result(){const total=levels[current].tasks.length,pct=Math.round(score/total*100),pass=score/total>=.7;best[current]=Math.max(best[current],pct);const all=best.every(n=>n>=70);app.innerHTML=`<section class="result"><div class="eyebrow">LEVEL 0${current+1} / RUN COMPLETE</div><div class="badge">${pass?'✦':'↻'}</div><div class="score">${pct}<span style="font-size:40px">%</span></div><h1>${pass?(current===4?'FINAL BOSS DEFEATED!':'LEVEL CLEARED!'):'Noch ein Versuch?'}</h1><p>${score} von ${total} richtig · ${xp} XP<br>${pass?`Abzeichen erhalten: <strong>${levels[current].badge}</strong>. ${current<levels.length-1?'Das nächste Level ist offen.':all?'Du hast alle fünf Levels gemeistert!':'Endgegner geschafft!'}`:`Du brauchst mindestens ${Math.ceil(total*.7)} richtige Antworten (${total===15?'11 von 15':'7 von 10'}). Schau dir deine Fehler an und starte mit neuem Wissen.`}</p><div class="actions">${pass&&current<levels.length-1?'<button class="primary" id="nextlevel">Nächstes Level →</button>':''}<button id="retry" class="${pass?'':'primary'}">Level wiederholen</button><button id="home">Levelauswahl</button></div><div class="review"><h2>Dein Replay</h2>${answers.map((a,i)=>`<details ${!a.ok?'open':''}><summary>${a.ok?'✓':'↻'} Mission ${i+1}: ${esc(a.q)}</summary><p>Deine Antwort: ${esc(a.value)}<br>Richtig: <strong>${esc(a.correct)}</strong><br>${esc(a.e)}</p></details>`).join('')}</div></section>`;app.querySelector('#retry').onclick=()=>intro(current);app.querySelector('#home').onclick=home;const next=app.querySelector('#nextlevel');if(next)next.onclick=()=>intro(current+1);goTop()}
document.querySelector('#logo').onclick=e=>{e.preventDefault();home()};document.querySelector('#sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'Sound an':'Sound aus';e.target.setAttribute('aria-pressed',sound)};document.querySelector('#reset').onclick=()=>{if(confirm('Alle Level und Abzeichen dieses Durchlaufs zurücksetzen?')){best=[0,0,0,0,0];home()}};home();
</script></body></html>
